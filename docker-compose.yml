version: '3.8'

services:
  # CV Application
  cv:
    build:
      context: ./cv
      dockerfile: Dockerfile
    container_name: cv-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - app-network
    ports:
      - "3001:3000"

  # Tech Notes Application
  tech-notes:
    build:
      context: ./tech-notes
      dockerfile: Dockerfile
    container_name: tech-notes-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - app-network
    ports:
      - "3002:3000"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Mount SSL certificates (you'll need to add your Cloudflare certificates here)
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Optional: Let's Encrypt certificates if using certbot
      # - ./certbot/conf:/etc/letsencrypt:ro
      # - ./certbot/www:/var/www/certbot:ro
    networks:
      - app-network
    depends_on:
      - cv
      - tech-notes

networks:
  app-network:
    driver: bridge
